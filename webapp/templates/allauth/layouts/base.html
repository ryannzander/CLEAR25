{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CLEAR25{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'dashboard/favicon.svg' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'dashboard/style.css' %}?v=55">
</head>
<body class="auth-body">
    <div class="auth-page">
        <div class="auth-card">
            <a class="auth-brand" href="/">
                <img src="{% static 'dashboard/favicon.svg' %}" alt="" width="28" height="28">
                <span>CLEAR25</span>
            </a>
            <h1 class="auth-title">{% block page_title %}{% endblock %}</h1>
            {% block content %}{% endblock %}
            <div class="auth-footer">
                <a href="/" class="auth-back"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Back to home</a>
            </div>
        </div>
    </div>
</body>
</html>
