<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="clr-o" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9d4d"/>
      <stop offset="1" stop-color="#f6821f"/>
    </linearGradient>
    <radialGradient id="clr-sweep" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#f6821f" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f6821f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- radar sweep wedge -->
  <path d="M32 32 L32 8 A24 24 0 0 1 52.8 20 Z" fill="url(#clr-sweep)"/>
  <!-- concentric rings -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#f6821f" stroke-opacity="0.30" stroke-width="2"/>
  <circle cx="32" cy="32" r="15" fill="none" stroke="#f6821f" stroke-opacity="0.55" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="8" fill="none" stroke="url(#clr-o)" stroke-width="3"/>
  <!-- detected blip -->
  <circle cx="46" cy="18" r="2.6" fill="#ff9d4d"/>
  <!-- core -->
  <circle cx="32" cy="32" r="3.4" fill="url(#clr-o)"/>
  <!-- sweep leading edge -->
  <line x1="32" y1="32" x2="32" y2="9" stroke="url(#clr-o)" stroke-width="2.2" stroke-linecap="round"/>
</svg>
